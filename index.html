<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>삼성 부품 가격 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --teal-900:#123840; --teal-700:#1b6b74; --teal-500:#2aa9b8; --teal-100:#e6f4f5;
    --ink:#26333a; --ink-soft:#5b6b73; --paper:#ffffff; --canvas:#f5f8f9; --line:#e1e8ea;
    --coral:#f2846b; --amber:#e8b84b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--canvas); color:var(--ink); padding:28px 20px 60px; }
  .wrap{ max-width:920px; margin:0 auto; }
  header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    border-bottom:2px solid var(--teal-900); padding-bottom:16px; margin-bottom:22px; flex-wrap:wrap;
  }
  header h1{ font-size:20px; margin:0 0 4px; color:var(--teal-900); }
  header p{ margin:0; color:var(--ink-soft); font-size:12.5px; }
  .refresh-area{ text-align:right; }
  .ts{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
  .ts b{ color:var(--teal-700); }
  .table-note{ font-size:11px; color:var(--ink-soft); margin-top:8px; }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:18px;
  }
  .card h2{ font-size:14.5px; margin:0 0 14px; color:var(--teal-900); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ border:1px solid var(--line); padding:8px 10px; text-align:center; }
  th{ background:var(--teal-100); color:var(--teal-900); font-size:12px; }
  td.left{ text-align:left; }
  .tag{
    display:inline-block; font-size:11px; font-weight:700; border-radius:999px;
    padding:2px 9px;
  }
  .tag.genuine{ background:#e6f4f5; color:var(--teal-700); }
  .tag.parallel{ background:#fdf0e4; color:#b96a2e; }
  .tag.compuzone{ background:#eef1fb; color:#4a56b8; }
  td.cap-cell{ font-weight:700; color:var(--teal-900); background:#fafcfc; vertical-align:middle; }

  .chart-controls{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .chart-controls label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .chart-controls select{
    padding:6px 10px; border-radius:8px; border:1px solid var(--line); font-size:12.5px;
  }
  canvas{ max-height:320px; }

  .empty{ color:#a9b6bb; font-size:13px; padding:30px; text-align:center; }
  .error{ color:#c0392b; font-size:13px; padding:16px; background:#fdecea; border-radius:8px; }

  .tabbar{ display:flex; gap:8px; margin-bottom:20px; }
  .tabbtn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    border-radius:999px; padding:8px 18px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .tabbtn.active{ background:var(--teal-900); border-color:var(--teal-900); color:white; }
  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; }
  .tag.rdimm{ background:#e6f4f5; color:var(--teal-700); }
  .tag.edimm{ background:#fdf0e4; color:#b96a2e; }
  .anomaly-badge{
    display:inline-block; margin-left:8px; font-size:11px; font-weight:700;
    color:#c0392b; background:#fdecea; border-radius:6px; padding:2px 7px;
    cursor:help;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="pageTitle">삼성 부품 가격 대시보드</h1>
      <p id="pageDesc" style="display:none;"></p>
    </div>
    <div class="refresh-area">
      <div class="ts" id="tsBox">불러오는 중...</div>
    </div>
  </header>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="ssd">SSD</button>
    <button class="tabbtn" data-tab="ram">서버 RAM</button>
  </div>

  <!-- ===================== SSD 탭 ===================== -->
  <div class="tabpanel active" id="tabpanel-ssd">
    <div class="card">
      <h2>최신 용량별 단가</h2>
      <div id="ssdTableArea"><div class="empty">불러오는 중...</div></div>
    </div>

    <div class="card">
      <h2>가격 추이 (부가세포함)</h2>
      <div class="chart-controls">
        <label>용량</label>
        <select id="ssdCapacitySelect"></select>
      </div>
      <canvas id="ssdTrendChart"></canvas>
    </div>
  </div>

  <!-- ===================== RAM 탭 ===================== -->
  <div class="tabpanel" id="tabpanel-ram">
    <div class="card">
      <h2>최신 용량별 단가 — 삼성전자 서버용 DDR4</h2>
      <div id="ramTableArea"><div class="empty">불러오는 중...</div></div>
    </div>

    <div class="card">
      <h2>가격 추이 (부가세포함)</h2>
      <div class="chart-controls">
        <label>용량</label>
        <select id="ramCapacitySelect"></select>
        <label>타입</label>
        <select id="ramDimmSelect">
          <option value="RDIMM">RDIMM (Registered)</option>
          <option value="EDIMM">EDIMM (Unbuffered)</option>
        </select>
      </div>
      <canvas id="ramTrendChart"></canvas>
    </div>
  </div>
</div>

<script>
// ============ 공통 유틸 ============
function fmtWon(n){ return n.toLocaleString('ko-KR') + '원'; }
function exclVat(n){ return Math.round(n / 1.1 / 100) * 100; }  // 추정값이므로 100원 단위로 반올림

// ============ 시세 이탈 감지 ============
// 최근 히스토리(오늘 제외)에서 같은 조합의 중앙값을 구해서, 오늘 값이 그보다
// 크게 벗어나면 경고 배지를 붙인다. (매칭 오류로 엉뚱한 상품이 잡혔을 가능성 표시용)
const ANOMALY_THRESHOLD = 0.25; // ±25% 이상 벗어나면 경고

function median(arr){
  if(!arr.length) return null;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function checkAnomaly(history, today, matchFn){
  const priorPrices = (history.entries || [])
    .filter(e => e.date !== today)
    .flatMap(e => (e.items||[]).filter(matchFn).map(it => it.price_krw));
  const baseline = median(priorPrices);
  return { baseline, priorCount: priorPrices.length };
}

function anomalyBadge(price, baseline, priorCount){
  if(baseline === null || priorCount < 2) return ''; // 비교할 과거 데이터가 부족하면 표시 안 함
  const diff = (price - baseline) / baseline;
  if(Math.abs(diff) < ANOMALY_THRESHOLD) return '';
  const pct = Math.round(diff * 100);
  const dir = diff > 0 ? '높음' : '낮음';
  const title = `최근 시세(중앙값 ${fmtWon(Math.round(baseline))}) 대비 ${Math.abs(pct)}% ${dir} — 매칭 오류일 수 있어 확인 필요`;
  return `<span class="anomaly-badge" title="${title}">⚠️ 시세대비 ${diff>0?'+':''}${pct}%</span>`;
}

function capacitySortKey(cap){
  const m = cap.match(/(\d+(?:\.\d+)?)\s*(TB|GB)/i);
  if(!m) return 0;
  const v = parseFloat(m[1]);
  return m[2].toUpperCase() === 'TB' ? v*1024 : v;
}

async function loadDataset(dataset, bust){
  const suffix = bust ? `?t=${Date.now()}` : '';
  const [latestRes, historyRes] = await Promise.all([
    fetch(`data/${dataset}/latest.json${suffix}`),
    fetch(`data/${dataset}/history.json${suffix}`),
  ]);
  if(!latestRes.ok) throw new Error(`${dataset}/latest.json을 불러오지 못했습니다.`);
  const latest = await latestRes.json();
  const history = historyRes.ok ? await historyRes.json() : {entries:[]};
  return {latest, history};
}

function renderTimestamp(latest){
  const box = document.getElementById('tsBox');
  box.innerHTML = `크롤링 시각: <b>${latest.updated_at_display || '-'}</b>`;
}

// ============ 탭 전환 ============
const TAB_META = {
  ssd: { title: '삼성 870 EVO 가격 대시보드', desc: '' },
  ram: { title: '삼성전자 서버용 DDR4 RAM 가격 대시보드', desc: '' },
};
let ramLoaded = false;

document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b===btn));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id === `tabpanel-${tab}`));
    document.getElementById('pageTitle').textContent = TAB_META[tab].title;
    document.getElementById('pageDesc').textContent = TAB_META[tab].desc;
    if(tab === 'ram' && !ramLoaded){ ramLoaded = true; loadAndRenderRAM(); }
    if(tab === 'ssd') renderTimestamp(window.__ssdLatest || {});
    if(tab === 'ram') renderTimestamp(window.__ramLatest || {});
  });
});

// ============ SSD 탭 ============
const SOURCE_ORDER = [
  { site: '다나와', source_type: '정품',    label: '정품',    tagClass: 'genuine',   color: '#f2846b' },
  { site: '다나와', source_type: '병행수입', label: '병행수입', tagClass: 'parallel',  color: '#2aa9b8' },
  { site: '컴퓨존', source_type: '정품',    label: '컴퓨존',   tagClass: 'compuzone', color: '#4a56b8' },
];

function sourceMeta(it){
  const found = SOURCE_ORDER.find(s => s.site === it.site && s.source_type === it.source_type);
  return found || { label: `${it.source_type}(${it.site})`, tagClass: 'genuine', color: '#888' };
}
function sourceOrderIndex(it){
  const idx = SOURCE_ORDER.findIndex(s => s.site === it.site && s.source_type === it.source_type);
  return idx === -1 ? 999 : idx;
}

let ssdHistory = null;
let ssdTrendChart = null;

function renderSSDTable(latest, history){
  const el = document.getElementById('ssdTableArea');
  const items = latest.items || [];
  if(!items.length){ el.innerHTML = '<div class="empty">데이터가 없습니다.</div>'; return; }

  const today = (history.entries && history.entries.length)
    ? history.entries[history.entries.length-1].date : null;

  const sorted = [...items].sort((a,b)=>{
    const capDiff = capacitySortKey(a.capacity) - capacitySortKey(b.capacity);
    if(capDiff !== 0) return capDiff;
    return sourceOrderIndex(a) - sourceOrderIndex(b);
  });

  const groups = [];
  sorted.forEach(it=>{
    const last = groups[groups.length-1];
    if(last && last.capacity === it.capacity){ last.rows.push(it); }
    else { groups.push({ capacity: it.capacity, rows: [it] }); }
  });

  const rows = groups.map(g=>{
    return g.rows.map((it, i)=>{
      const meta = sourceMeta(it);
      const capCell = i===0 ? `<td class="cap-cell" rowspan="${g.rows.length}">${g.capacity}</td>` : '';
      const { baseline, priorCount } = checkAnomaly(history, today, x =>
        x.capacity === it.capacity && x.site === it.site && x.source_type === it.source_type
      );
      const badge = anomalyBadge(it.price_krw, baseline, priorCount);
      return `<tr>
        ${capCell}
        <td><span class="tag ${meta.tagClass}">${meta.label}</span></td>
        <td>${fmtWon(it.price_krw)}${badge}</td>
        <td>${fmtWon(exclVat(it.price_krw))}</td>
      </tr>`;
    }).join('');
  }).join('');

  el.innerHTML = `
    <table>
      <thead><tr><th>용량</th><th>구분</th><th>가격(부가세포함)</th><th>가격(부가세별도, 추정)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="table-note">※ 부가세별도 금액은 크롤링되는 부가세포함 가격을 기준으로 계산한 추정값입니다 (÷1.1, 반올림).</p>
    <p class="table-note">⚠️ 배지는 최근 시세(중앙값) 대비 ±25% 이상 차이날 때 표시됩니다. 매칭 오류 가능성이 있으니 배지가 붙은 항목은 링크로 직접 확인해보시는 걸 권장합니다.</p>
  `;
}

function populateSSDCapacitySelect(history){
  const select = document.getElementById('ssdCapacitySelect');
  const caps = new Set();
  (history.entries||[]).forEach(e => (e.items||[]).forEach(it => caps.add(it.capacity)));
  const sortedCaps = [...caps].sort((a,b)=> capacitySortKey(a) - capacitySortKey(b));
  select.innerHTML = sortedCaps.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(sortedCaps.includes('1TB')) select.value = '1TB';
}

function renderSSDTrendChart(history, capacity){
  const entries = (history.entries || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const dates = entries.map(e=>e.date);

  const seriesFor = (site, sourceType) => entries.map(e=>{
    const item = (e.items||[]).find(it => it.capacity === capacity && it.site === site && it.source_type === sourceType);
    return item ? item.price_krw : null;
  });

  const datasets = SOURCE_ORDER.map(s => ({
    label: s.label,
    data: seriesFor(s.site, s.source_type),
    borderColor: s.color,
    backgroundColor: s.color,
    spanGaps: true,
    tension: 0.25,
  }));

  if(ssdTrendChart) ssdTrendChart.destroy();
  ssdTrendChart = new Chart(document.getElementById('ssdTrendChart'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position:'bottom' } },
      scales: { y: { ticks: { callback: v => v.toLocaleString('ko-KR') + '원' } } }
    }
  });
}

async function loadAndRenderSSD(){
  try{
    const {latest, history} = await loadDataset('ssd', false);
    window.__ssdLatest = latest;
    ssdHistory = history;
    renderTimestamp(latest);
    renderSSDTable(latest, history);
    populateSSDCapacitySelect(history);
    renderSSDTrendChart(history, document.getElementById('ssdCapacitySelect').value);
  }catch(err){
    document.getElementById('ssdTableArea').innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${err.message}</div>`;
  }
}

document.getElementById('ssdCapacitySelect').addEventListener('change', (e)=>{
  if(ssdHistory) renderSSDTrendChart(ssdHistory, e.target.value);
});

// ============ RAM 탭 ============
const RAM_COMBO_ORDER = [
  { dimm_type:'RDIMM', clock:'17000', label:'RDIMM (PC4-17000)', color:'#f2846b' },
  { dimm_type:'RDIMM', clock:'19200', label:'RDIMM (PC4-19200)', color:'#e8b84b' },
  { dimm_type:'RDIMM', clock:'21300', label:'RDIMM (PC4-21300)', color:'#8fbf9f' },
  { dimm_type:'RDIMM', clock:'25600', label:'RDIMM (PC4-25600)', color:'#7ab8d9' },
  { dimm_type:'EDIMM', clock:'19200', label:'EDIMM (PC4-19200)', color:'#a893c9' },
  { dimm_type:'EDIMM', clock:'21300', label:'EDIMM (PC4-21300)', color:'#e88fa8' },
  { dimm_type:'EDIMM', clock:'25600', label:'EDIMM (PC4-25600)', color:'#4a56b8' },
];

function ramComboMeta(it){
  return RAM_COMBO_ORDER.find(c => c.dimm_type === it.dimm_type && c.clock === it.clock)
      || { label: `${it.dimm_type} (PC4-${it.clock})`, color:'#888' };
}
function ramComboOrderIndex(it){
  const idx = RAM_COMBO_ORDER.findIndex(c => c.dimm_type === it.dimm_type && c.clock === it.clock);
  return idx === -1 ? 999 : idx;
}

let ramHistory = null;
let ramTrendChart = null;

function renderRAMTable(latest, history){
  const el = document.getElementById('ramTableArea');
  const items = latest.items || [];
  if(!items.length){ el.innerHTML = '<div class="empty">데이터가 없습니다.</div>'; return; }

  const today = (history.entries && history.entries.length)
    ? history.entries[history.entries.length-1].date : null;

  const sorted = [...items].sort((a,b)=>{
    const capDiff = capacitySortKey(a.capacity) - capacitySortKey(b.capacity);
    if(capDiff !== 0) return capDiff;
    return ramComboOrderIndex(a) - ramComboOrderIndex(b);
  });

  const groups = [];
  sorted.forEach(it=>{
    const last = groups[groups.length-1];
    if(last && last.capacity === it.capacity){ last.rows.push(it); }
    else { groups.push({ capacity: it.capacity, rows: [it] }); }
  });

  const rows = groups.map(g=>{
    return g.rows.map((it, i)=>{
      const meta = ramComboMeta(it);
      const tagClass = it.dimm_type === 'RDIMM' ? 'rdimm' : 'edimm';
      const capCell = i===0 ? `<td class="cap-cell" rowspan="${g.rows.length}">${g.capacity}</td>` : '';
      const { baseline, priorCount } = checkAnomaly(history, today, x =>
        x.capacity === it.capacity && x.dimm_type === it.dimm_type && x.clock === it.clock
      );
      const badge = anomalyBadge(it.price_krw, baseline, priorCount);
      return `<tr>
        ${capCell}
        <td><span class="tag ${tagClass}">${meta.label}</span></td>
        <td>${fmtWon(it.price_krw)}${badge}</td>
        <td>${fmtWon(exclVat(it.price_krw))}</td>
      </tr>`;
    }).join('');
  }).join('');

  el.innerHTML = `
    <table>
      <thead><tr><th>용량</th><th>타입/클럭</th><th>가격(부가세포함)</th><th>가격(부가세별도, 추정)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="table-note">※ 판매자마다 다르게 표기된 상품 중 삼성전자 최저가를 채택한 값입니다. 부가세별도는 계산 추정값입니다.</p>
    <p class="table-note">⚠️ 배지는 최근 시세(중앙값) 대비 ±25% 이상 차이날 때 표시됩니다. 매칭 오류 가능성이 있으니 배지가 붙은 항목은 링크로 직접 확인해보시는 걸 권장합니다.</p>
  `;
}

function populateRAMSelects(history){
  const capSelect = document.getElementById('ramCapacitySelect');
  const caps = new Set();
  (history.entries||[]).forEach(e => (e.items||[]).forEach(it => caps.add(it.capacity)));
  const sortedCaps = [...caps].sort((a,b)=> capacitySortKey(a) - capacitySortKey(b));
  capSelect.innerHTML = sortedCaps.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(sortedCaps.includes('16GB')) capSelect.value = '16GB';
}

function renderRAMTrendChart(history, capacity, dimmType){
  const entries = (history.entries || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const dates = entries.map(e=>e.date);

  const combosForType = RAM_COMBO_ORDER.filter(c => c.dimm_type === dimmType);
  const seriesFor = (clock) => entries.map(e=>{
    const item = (e.items||[]).find(it => it.capacity === capacity && it.dimm_type === dimmType && it.clock === clock);
    return item ? item.price_krw : null;
  });

  const datasets = combosForType.map(c => ({
    label: c.label,
    data: seriesFor(c.clock),
    borderColor: c.color,
    backgroundColor: c.color,
    spanGaps: true,
    tension: 0.25,
  }));

  if(ramTrendChart) ramTrendChart.destroy();
  ramTrendChart = new Chart(document.getElementById('ramTrendChart'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position:'bottom' } },
      scales: { y: { ticks: { callback: v => v.toLocaleString('ko-KR') + '원' } } }
    }
  });
}

async function loadAndRenderRAM(){
  try{
    const {latest, history} = await loadDataset('ram', false);
    window.__ramLatest = latest;
    ramHistory = history;
    renderRAMTable(latest, history);
    populateRAMSelects(history);
    renderRAMTrendChart(history, document.getElementById('ramCapacitySelect').value, document.getElementById('ramDimmSelect').value);
  }catch(err){
    document.getElementById('ramTableArea').innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${err.message}</div>`;
  }
}

document.getElementById('ramCapacitySelect').addEventListener('change', ()=>{
  if(ramHistory) renderRAMTrendChart(ramHistory, document.getElementById('ramCapacitySelect').value, document.getElementById('ramDimmSelect').value);
});
document.getElementById('ramDimmSelect').addEventListener('change', ()=>{
  if(ramHistory) renderRAMTrendChart(ramHistory, document.getElementById('ramCapacitySelect').value, document.getElementById('ramDimmSelect').value);
});

// 시작 시 SSD 탭 데이터만 우선 로드 (RAM은 탭 클릭 시 로드)
loadAndRenderSSD();
</script>
</body>
</html>
