<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>삼성 870 EVO 가격 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --teal-900:#123840; --teal-700:#1b6b74; --teal-500:#2aa9b8; --teal-100:#e6f4f5;
    --ink:#26333a; --ink-soft:#5b6b73; --paper:#ffffff; --canvas:#f5f8f9; --line:#e1e8ea;
    --coral:#f2846b; --amber:#e8b84b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--canvas); color:var(--ink); padding:28px 20px 60px; }
  .wrap{ max-width:920px; margin:0 auto; }
  header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    border-bottom:2px solid var(--teal-900); padding-bottom:16px; margin-bottom:22px; flex-wrap:wrap;
  }
  header h1{ font-size:20px; margin:0 0 4px; color:var(--teal-900); }
  header p{ margin:0; color:var(--ink-soft); font-size:12.5px; }
  .refresh-area{ text-align:right; }
  .refresh-btn{
    border:none; background:var(--teal-700); color:white; border-radius:8px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .refresh-btn:hover{ opacity:.9; }
  .refresh-btn:disabled{ background:#c7d2d5; cursor:default; }
  .ts{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
  .ts b{ color:var(--teal-700); }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:18px;
  }
  .card h2{ font-size:14.5px; margin:0 0 14px; color:var(--teal-900); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ border:1px solid var(--line); padding:8px 10px; text-align:center; }
  th{ background:var(--teal-100); color:var(--teal-900); font-size:12px; }
  td.left{ text-align:left; }
  .tag{
    display:inline-block; font-size:11px; font-weight:700; border-radius:999px;
    padding:2px 9px;
  }
  .tag.genuine{ background:#e6f4f5; color:var(--teal-700); }
  .tag.parallel{ background:#fdf0e4; color:#b96a2e; }

  .chart-controls{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .chart-controls label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .chart-controls select{
    padding:6px 10px; border-radius:8px; border:1px solid var(--line); font-size:12.5px;
  }
  canvas{ max-height:320px; }

  .empty{ color:#a9b6bb; font-size:13px; padding:30px; text-align:center; }
  .error{ color:#c0392b; font-size:13px; padding:16px; background:#fdecea; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>삼성 870 EVO 가격 대시보드</h1>
      <p>다나와 정품 · 병행수입 용량별 단가 · 매일 자동 수집</p>
    </div>
    <div class="refresh-area">
      <button class="refresh-btn" id="refreshBtn">🔄 새로고침</button>
      <div class="ts" id="tsBox">불러오는 중...</div>
    </div>
  </header>

  <div class="card">
    <h2>최신 용량별 단가</h2>
    <div id="tableArea"><div class="empty">불러오는 중...</div></div>
  </div>

  <div class="card">
    <h2>가격 추이 (원/GB)</h2>
    <div class="chart-controls">
      <label>용량</label>
      <select id="capacitySelect"></select>
    </div>
    <canvas id="trendChart"></canvas>
  </div>
</div>

<script>
const PALETTE = { '정품(리테일)': '#f2846b', '병행수입': '#2aa9b8' };
let historyData = null;
let trendChart = null;

function fmtWon(n){ return n.toLocaleString('ko-KR') + '원'; }

function capacitySortKey(cap){
  const m = cap.match(/(\d+(?:\.\d+)?)\s*(TB|GB)/i);
  if(!m) return 0;
  const v = parseFloat(m[1]);
  return m[2].toUpperCase() === 'TB' ? v*1024 : v;
}

async function loadData(bust){
  const suffix = bust ? `?t=${Date.now()}` : '';
  const [latestRes, historyRes] = await Promise.all([
    fetch(`data/latest.json${suffix}`),
    fetch(`data/history.json${suffix}`),
  ]);
  if(!latestRes.ok) throw new Error('latest.json을 불러오지 못했습니다.');
  const latest = await latestRes.json();
  const history = historyRes.ok ? await historyRes.json() : {entries:[]};
  return {latest, history};
}

function renderTimestamp(latest){
  const box = document.getElementById('tsBox');
  const checked = new Date().toLocaleString('ko-KR', {hour12:false});
  box.innerHTML = `크롤링 시각: <b>${latest.updated_at_display || '-'}</b><br>마지막 확인: <b>${checked}</b>`;
}

function renderTable(latest){
  const el = document.getElementById('tableArea');
  const items = latest.items || [];
  if(!items.length){ el.innerHTML = '<div class="empty">데이터가 없습니다.</div>'; return; }

  const sorted = [...items].sort((a,b)=>{
    if(a.source_type !== b.source_type) return a.source_type.localeCompare(b.source_type);
    return capacitySortKey(a.capacity) - capacitySortKey(b.capacity);
  });

  const rows = sorted.map(it=>{
    const tagClass = it.source_type === '병행수입' ? 'parallel' : 'genuine';
    const unitPrice = it.price_per_gb_krw ? fmtWon(it.price_per_gb_krw) + '/GB' : '-';
    return `<tr>
      <td><span class="tag ${tagClass}">${it.source_type}</span></td>
      <td>${it.capacity}</td>
      <td>${fmtWon(it.price_krw)}</td>
      <td>${unitPrice}</td>
      <td class="left"><a href="${it.url}" target="_blank" rel="noopener">다나와 링크</a></td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <table>
      <thead><tr><th>구분</th><th>용량</th><th>가격</th><th>단가</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function populateCapacitySelect(history){
  const select = document.getElementById('capacitySelect');
  const caps = new Set();
  (history.entries||[]).forEach(e => (e.items||[]).forEach(it => caps.add(it.capacity)));
  const sortedCaps = [...caps].sort((a,b)=> capacitySortKey(a) - capacitySortKey(b));
  select.innerHTML = sortedCaps.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(sortedCaps.includes('1TB')) select.value = '1TB';
}

function renderTrendChart(history, capacity){
  const entries = (history.entries || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const dates = entries.map(e=>e.date);

  const seriesFor = (sourceType) => entries.map(e=>{
    const item = (e.items||[]).find(it => it.capacity === capacity && it.source_type === sourceType);
    return item ? item.price_per_gb_krw : null;
  });

  const datasets = ['정품(리테일)','병행수입'].map(st => ({
    label: st,
    data: seriesFor(st),
    borderColor: PALETTE[st],
    backgroundColor: PALETTE[st],
    spanGaps: true,
    tension: 0.25,
  }));

  if(trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position:'bottom' } },
      scales: { y: { ticks: { callback: v => v.toLocaleString('ko-KR') } } }
    }
  });
}

async function refresh(bust){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  try{
    const {latest, history} = await loadData(bust);
    historyData = history;
    renderTimestamp(latest);
    renderTable(latest);
    populateCapacitySelect(history);
    renderTrendChart(history, document.getElementById('capacitySelect').value);
  }catch(err){
    document.getElementById('tableArea').innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${err.message}</div>`;
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('refreshBtn').addEventListener('click', ()=> refresh(true));
document.getElementById('capacitySelect').addEventListener('change', (e)=>{
  if(historyData) renderTrendChart(historyData, e.target.value);
});

refresh(false);
</script>
</body>
</html>
