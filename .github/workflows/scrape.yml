name: 870 EVO 가격 수집

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 크롤링 실행
        run: python scripts/scrape_870evo.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "870evo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --staged --quiet && echo "변경 없음, 커밋 생략" || git commit -m "chore: 870 EVO 가격 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
